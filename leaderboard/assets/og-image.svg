<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset=".48" stop-color="#f8fafc"/><stop offset="1" stop-color="#ecfeff"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f97316"/><stop offset="1" stop-color="#0f766e"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity=".14"/></filter>
    <style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.title{font-size:72px;font-weight:850;fill:#0f172a}.sub{font-size:29px;fill:#475569}.metric{font-size:42px;font-weight:850;fill:#0f172a}.label{font-size:20px;font-weight:700;fill:#64748b}</style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1100" cy="85" r="155" fill="#99f6e4" opacity=".35"/><circle cx="60" cy="590" r="180" fill="#fed7aa" opacity=".45"/>
  <g transform="translate(80 72)">
    <rect width="72" height="72" rx="17" fill="url(#accent)"/>
    <g fill="#fff"><rect x="15" y="17" width="17" height="12" rx="2"/><rect x="40" y="17" width="17" height="12" rx="2"/><rect x="15" y="43" width="17" height="12" rx="2"/><rect x="40" y="43" width="17" height="12" rx="2"/></g>
    <text x="94" y="57" class="title">TwinRouterBench</text>
    <text x="0" y="132" class="sub">Fast static supervision. Live agentic routing evaluation.</text>
  </g>
  <g filter="url(#s)" transform="translate(80 280)">
    <rect width="1040" height="236" rx="30" fill="#fff" stroke="#e2e8f0"/>
    <g transform="translate(45 54)"><text class="metric">970</text><text y="38" class="label">step-level labels</text><text y="72" class="label">across 5 workloads</text></g>
    <path d="M272 38v160" stroke="#e2e8f0"/>
    <g transform="translate(320 54)"><text class="metric">100</text><text y="38" class="label">held-out SWE-bench</text><text y="72" class="label">Verified cases</text></g>
    <path d="M548 38v160" stroke="#e2e8f0"/>
    <g transform="translate(600 54)"><text class="metric">75%</text><text y="38" class="label">best resolve rate</text><text y="72" class="label">live dynamic track</text></g>
    <path d="M792 38v160" stroke="#e2e8f0"/>
    <g transform="translate(835 54)"><text class="metric">−53.1%</text><text y="38" class="label">cost vs Opus</text><text y="72" class="label">reference run</text></g>
  </g>
  <rect x="80" y="550" width="1040" height="3" rx="2" fill="url(#accent)"/>
  <text x="80" y="594" class="label" style="font-size:22px;fill:#334155">Paper · Code · Dataset · Data Pipeline · Public Leaderboard</text>
</svg>
